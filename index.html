<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Khánh Đăng</title>
    <!-- Thư viện FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a url('https://images.unsplash.com/photo-1511497584788-8767611136f0?q=80&w=1920') no-repeat center center/cover;
            color: #fff;
            overflow: hidden;
            cursor: pointer;
        }

        /* Nút bật/tắt nhạc góc trái */
        .audio-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            color: #fff;
            font-size: 18px;
            transition: 0.3s;
            z-index: 100;
        }
        .audio-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* Khung kính mờ Glassmorphism */
        .card {
            width: 90%;
            max-width: 420px;
            background: rgba(20, 25, 40, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Avatar Mèo Nakroth */
        .avatar-container img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
        }

        /* Tên chính */
        .name {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: #00d2ff;
            margin: 12px 0 4px 0;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .location {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        /* Khung status Discord */
        .status-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .status-avatar {
            position: relative;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
        }

        .status-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }

        .online-dot {
            width: 13px;
            height: 13px;
            background: #23a55a;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid #1e1e1e;
        }

        .status-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .status-info p {
            font-size: 11px;
            color: #94a3b8;
        }

        .status-id {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Icon Mạng Xã Hội */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .social-icons a {
            color: #fff;
            font-size: 22px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icons a:hover {
            transform: translateY(-4px);
            background: #5865F2;
            color: #fff;
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        /* Lượt xem */
        .views {
            position: absolute;
            bottom: 12px;
            left: 20px;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Ẩn hoàn toàn khung video YouTube */
        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Khung ẩn để chạy nhạc từ YouTube của bạn -->
    <div id="youtube-player"></div>

    <!-- Nút loa bật/tắt nhạc -->
    <button class="audio-btn" id="audioBtn">
        <i id="audioIcon" class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- Khung giao diện chính -->
    <div class="card">
        <div class="avatar-container">
            <img src="./images.ico" alt="Mèo Nakroth">
        </div>

        <h2 class="name">Khánh Đăng</h2>
        <p class="location"><i class="fa-solid fa-location-dot"></i> Đồng Nai, Việt Nam</p>

        <!-- Trạng thái Discord -->
        <div class="status-box">
            <div class="status-avatar">
                <img src="./images.ico" alt="Mèo Nakroth Status">
                <div class="online-dot"></div>
            </div>
            <div class="status-info">
                <h4>khanhdang. <span style="font-size: 10px; background: rgba(88, 101, 242, 0.4); padding: 2px 6px; border-radius: 4px; color: #5865F2;">DISCORD</span></h4>
                <p>currently doing nothing</p>
                <div class="status-id"><i class="fa-solid fa-id-card"></i> ID: 1514256094090760322</div>
            </div>
        </div>

        <!-- Mạng xã hội -->
        <div class="social-icons">
            <a href="https://facebook.com" target="_blank" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://discord.gg/wmSBkvXEb" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="https://tiktok.com" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" target="_blank" title="Website"><i class="fa-solid fa-globe"></i></a>
        </div>

        <!-- Lượt xem -->
        <div class="views">
            <i class="fa-regular fa-eye"></i> <span>1</span>
        </div>
    </div>

    <!-- Tải API YouTube Player -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let isPlaying = false;
        const audioIcon = document.getElementById("audioIcon");
        const audioBtn = document.getElementById("audioBtn");

        // Tạo trình phát nhạc YouTube ẩn sử dụng ID video của bạn (T2h5UH3SNjg)
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: 'T2h5UH3SNjg',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'T2h5UH3SNjg'
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                audioIcon.className = "fa-solid fa-volume-high";
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                audioIcon.className = "fa-solid fa-volume-xmark";
            }
        }

        function togglePlay() {
            if (!player || typeof player.playVideo !== 'function') return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        audioBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            togglePlay();
        });

        // Click bất kỳ đâu trên màn hình lần đầu tiên để bật nhạc ngay
        document.body.addEventListener("click", function() {
            if (!isPlaying && player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
        }, { once: true });
    </script>
</body>
</html>
