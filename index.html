        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: #fff;
            overflow: hidden;
            position: relative;
            font-family: 'Poppins', sans-serif;
        }

        /* ---------------- MÀN HÌNH CLICK TO ENTER ---------------- */
        #enterOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            user-select: none;
        }

        #enterOverlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-text {
            font-family: 'UnifrakturMaguntia', 'Cinzel', serif;
            font-size: 32px;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            animation: textBreathe 2s ease-in-out infinite;
        }

        @keyframes textBreathe {
            0%, 100% {
                opacity: 0.6;
                transform: scale(0.98);
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
                text-shadow: 0 0 25px rgba(255, 255, 255, 0.95);
            }
        }

        /* VIDEO NỀN ĐỘNG WANDERING SAMURAI */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -999;
            pointer-events: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.12);
            z-index: -998;
            pointer-events: none;
        }

        /* NÚT LOA */
        .audio-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .audio-btn i {
            color: #f8fafc;
            font-size: 20px;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
        }

        .audio-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* WIDGET ĐỒNG HỒ & THỜI GIAN */
        .clock-widget {
            position: fixed;
            top: 20px;
            right: 25px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 10px 22px 14px 22px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.3s ease;
        }

        .clock-widget:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .clock-date {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f1f5f9;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .clock-date .star-icon {
            color: #ffffff;
            font-size: 11px;
            filter: drop-shadow(0 0 6px #ffffff);
            animation: starTwinkle 2.5s ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 10px #ffffff); }
        }

        .clock-time-wrapper {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .clock-main-time {
            font-size: 56px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9),
                         0 0 30px rgba(255, 255, 255, 0.5),
                         0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .clock-colon {
            animation: colonBlink 1s infinite;
        }

        @keyframes colonBlink {
            0%, 49% { opacity: 1; }

    <div id="youtube-audio-player"></div>

    <script>
        const YT_VIDEO_ID = 'y-ZgVzQ6_tE';
        let ytPlayer = null;
        let isYtReady = false;
        let isAudioPlaying = false;
        let progressTimer = null;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-audio-player', {
                height: '0',
                width: '0',
                videoId: YT_VIDEO_ID,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': YT_VIDEO_ID
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isYtReady = true;
            ytPlayer.setVolume(100);
            updateTotalTime();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isAudioPlaying = true;
                updateAudioUI(true);
                startProgressLoop();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isAudioPlaying = false;
                updateAudioUI(false);
                stopProgressLoop();
            }
        }

        function toggleAudio() {
            if (!isYtReady || !ytPlayer) return;
            if (isAudioPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        function updateAudioUI(playing) {
            const discImg = document.getElementById('discImg');
            const audioIcon = document.getElementById('audioIcon');
            if (playing) {
                discImg.classList.add('playing');
                audioIcon.className = 'fa-solid fa-volume-high';
            } else {
                discImg.classList.remove('playing');
                audioIcon.className = 'fa-solid fa-volume-xmark';
            }
        }

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
        }

        function updateTotalTime() {
            if (!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;
            const duration = ytPlayer.getDuration();
            if (duration > 0) {
                document.getElementById('timeTotal').innerText = formatTime(duration);
            }
        }

        function startProgressLoop() {
            stopProgressLoop();
            progressTimer = setInterval(() => {
                if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
                const current = ytPlayer.getCurrentTime();
                const total = ytPlayer.getDuration();
                document.getElementById('timeCurrent').innerText = formatTime(current);
                if (total > 0) {
                    const percent = (current / total) * 100;
                    document.getElementById('progressBar').style.width = percent + '%';
                }
            }, 500);
        }

        function stopProgressLoop() {
            if (progressTimer) clearInterval(progressTimer);
        }

        document.getElementById('audioToggle').addEventListener('click', toggleAudio);
        document.getElementById('btnPlayPause').addEventListener('click', toggleAudio);

        const progressContainer = document.getElementById('progressContainer');
        progressContainer.addEventListener('click', (e) => {
            if (!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const seekPercent = clickX / width;
            const duration = ytPlayer.getDuration();
            if (duration > 0) {
                ytPlayer.seekTo(duration * seekPercent, true);
            }
        });

        const enterOverlay = document.getElementById('enterOverlay');
        enterOverlay.addEventListener('click', () => {
            enterOverlay.classList.add('hide');
            if (isYtReady && ytPlayer) {
                ytPlayer.playVideo();
            } else {
                const checkReady = setInterval(() => {
                    if (isYtReady && ytPlayer) {
                        ytPlayer.playVideo();
                        clearInterval(checkReady);
                    }
                }, 300);
            }
        });

        const btnHeart = document.getElementById('btnHeart');
        btnHeart.addEventListener('click', () => {
            const icon = btnHeart.querySelector('i');
            if (icon.classList.contains('fa-regular')) {
                icon.className = 'fa-solid fa-heart';
                icon.style.color = '#f43f5e';
            } else {
                icon.className = 'fa-regular fa-heart';
                icon.style.color = '#e2e8f0';
            }
        });

        /* ĐỒNG HỒ REAL-TIME CHẠY LIÊN TỤC VÀ TÍNH KIM GIÂY */
        const dayNames = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
        const monthNames = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

        function updateClock() {
            const now = new Date();
            const dayOfWeek = dayNames[now.getDay()];
            const monthName = monthNames[now.getMonth()];
            const dateNum = now.getDate();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            const hoursFormatted = hours < 10 ? '0' + hours : hours;
            const minutesFormatted = minutes < 10 ? '0' + minutes : minutes;
            const secondsFormatted = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('dayName').innerText = dayOfWeek;
            document.getElementById('fullDate').innerText = `${monthName} ${dateNum}`;
            document.getElementById('clockMainTime').innerHTML = `${hoursFormatted}<span class="clock-colon">:</span>${minutesFormatted}`;
            document.getElementById('clockSeconds').innerText = secondsFormatted;
        }

        updateClock();
        setInterval(updateClock, 1000);

        /* DISCORD LANYARD API */
        const DISCORD_USER_ID = '1514256094090760322';
        async function fetchLanyardData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
                const data = await response.json();
                if (data.success && data.data) {
                    const user = data.data.discord_user;
                    const avatarUrl = user.avatar
                        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`
                        : './images.ico';
                    document.getElementById('userAvatar').src = avatarUrl;
                    document.getElementById('discordAvatar').src = avatarUrl;
                    document.getElementById('discImg').src = avatarUrl;

                    if (user.avatar_decoration_data) {
                        const frameAsset = user.avatar_decoration_data.asset;
                        const frameUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${frameAsset}.png?size=160&passthrough=true`;
                        const frameEl = document.getElementById('userAvatarDecoration');
                        frameEl.src = frameUrl;
                        frameEl.style.display = 'block';
                    }

                    document.getElementById('userGlobalName').innerText = user.global_name || user.username;
                    document.getElementById('discordUsername').innerText = user.username;

                    const statusColors = {
                        online: '#22c55e',
                        idle: '#eab308',
                        dnd: '#ef4444',
                        offline: '#64748b'
                    };
                    document.getElementById('discordStatus').style.background = statusColors[data.data.discord_status] || '#64748b';

                    const customStatus = data.data.activities.find(act => act.type === 4);
                    if (customStatus && customStatus.state) {
                        document.getElementById('discordCustomStatus').innerText = customStatus.state;
                    } else {
                        document.getElementById('discordCustomStatus').innerText = data.data.discord_status.toUpperCase();
                    }
                }
            } catch (err) {
                console.error("Lanyard API error:", err);
            }
        }
        fetchLanyardData();
        setInterval(fetchLanyardData, 30000);
    </script>
</body>
</html>
