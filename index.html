<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Khánh Đăng</title>
    <!-- Thư viện FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a url('https://i.pinimg.com/originals/f9/57/6f/f9576fca9fc8ef79976a1d6327bbe9ae.gif') no-repeat center center/cover;
            color: #fff;
            overflow: hidden;
        }

        /* Nút loa góc trái */
        .audio-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            color: #fff;
            font-size: 20px;
            transition: 0.3s;
            z-index: 999;
        }
        .audio-btn:hover { 
            background: rgba(255, 255, 255, 0.4); 
            transform: scale(1.05);
        }

        /* Khung kính mờ Glassmorphism */
        .card {
            width: 90%;
            max-width: 420px;
            background: rgba(20, 25, 40, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* KHUNG CHỨA AVATAR VÀ DECORATION */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Khung trang trí Discord tự động lấy từ API */
        .avatar-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 130px;
            height: 130px;
            pointer-events: none;
            display: none;
        }

        /* LINK MỞ HỒ SƠ DISCORD */
        .name-link {
            text-decoration: none;
            display: inline-block;
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: #00d2ff;
            margin: 12px 0 4px 0;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
            transition: 0.3s ease;
        }

        .name-link:hover .name {
            color: #ffffff;
            text-shadow: 0 0 18px rgba(0, 210, 255, 1);
            transform: scale(1.05);
        }

        .location {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .status-avatar {
            position: relative;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
        }

        .status-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }

        .online-dot {
            width: 13px;
            height: 13px;
            background: #747f8d;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid #1e1e1e;
        }

        .status-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .status-info p {
            font-size: 11px;
            color: #94a3b8;
        }

        .status-id {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .social-icons a {
            color: #fff;
            font-size: 22px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icons a:hover {
            transform: translateY(-4px);
            background: #5865F2;
            color: #fff;
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        .views {
            position: absolute;
            bottom: 12px;
            left: 20px;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- Nút Loa Bật/Tắt Nhạc -->
    <button class="audio-btn" id="audioBtn">
        <i id="audioIcon" class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- Thẻ Audio HTML5 Phát Nhạc Trực Tiếp Mượt Mà -->
    <audio id="bgMusic" loop src="https://files.catbox.moe/k33r2m.mp3"></audio>

    <div class="card">
        <!-- Khung chứa Avatar & Frame Discord -->
        <div class="avatar-container">
            <img class="avatar-img" id="userAvatar" src="./images.ico" alt="Avatar">
            <img class="avatar-frame" id="userFrame" src="" alt="Discord Decoration">
        </div>

        <!-- Tên được chuyển thành Link mở thẳng Hồ Sơ Discord -->
        <a href="https://discord.com/users/1514256094090760322" target="_blank" class="name-link" title="Xem hồ sơ Discord">
            <h2 class="name" id="displayName">khanhdang.</h2>
        </a>

        <p class="location"><i class="fa-solid fa-location-dot"></i> Đồng Nai, Việt Nam</p>

        <div class="status-box">
            <div class="status-avatar">
                <img id="smallAvatar" src="./images.ico" alt="Status Avatar">
                <div class="online-dot" id="statusDot"></div>
            </div>
            <div class="status-info">
                <h4>khanhdang. <span style="font-size: 10px; background: rgba(88, 101, 242, 0.4); padding: 2px 6px; border-radius: 4px; color: #5865F2;">DISCORD</span></h4>
                <p id="discordActivity">currently doing nothing</p>
                <div class="status-id"><i class="fa-solid fa-id-card"></i> ID: 1514256094090760322</div>
            </div>
        </div>

        <div class="social-icons">
            <a href="https://facebook.com" target="_blank" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://discord.gg/tg7BTRZht" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="https://www.tiktok.com/@_k...dang_" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" target="_blank" title="Website"><i class="fa-solid fa-globe"></i></a>
        </div>

        <div class="views">
            <i class="fa-regular fa-eye"></i> <span>1</span>
        </div>
    </div>

    <!-- Script kết nối API Discord (Lanyard) -->
    <script>
        const DISCORD_ID = "1514256094090760322";

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const res = await response.json();

                if (res.success && res.data) {
                    const data = res.data;
                    const user = data.discord_user;

                    // 1. Tên hiển thị Discord
                    const nameElem = document.getElementById('displayName');
                    if (user.global_name) {
                        nameElem.innerText = user.global_name;
                    } else if (user.username) {
                        nameElem.innerText = user.username;
                    }

                    // 2. Avatar Discord
                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`;
                        document.getElementById('userAvatar').src = avatarUrl;
                        document.getElementById('smallAvatar').src = avatarUrl;
                    }

                    // 3. Khung trang trí (Avatar Decoration)
                    if (user.avatar_decoration_data) {
                        const frameAsset = user.avatar_decoration_data.asset;
                        const frameUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${frameAsset}.png`;
                        const frameElem = document.getElementById('userFrame');
                        frameElem.src = frameUrl;
                        frameElem.style.display = 'block';
                    }

                    // 4. Trạng thái Online/Offline
                    const dot = document.getElementById('statusDot');
                    const statusColors = {
                        online: '#23a55a',
                        idle: '#f0b232',
                        dnd: '#f23f43',
                        offline: '#747f8d'
                    };
                    dot.style.background = statusColors[data.discord_status] || '#747f8d';

                    // 5. Hoạt động Discord
                    const activityElem = document.getElementById('discordActivity');
                    if (data.activities && data.activities.length > 0) {
                        const customStatus = data.activities.find(a => a.type === 4);
                        if (customStatus && customStatus.state) {
                            activityElem.innerText = customStatus.state;
                        } else if (data.activities[0].name) {
                            activityElem.innerText = `Playing ${data.activities[0].name}`;
                        }
                    }
                }
            } catch (err) {
                console.log("Lỗi tải dữ liệu Discord:", err);
            }
        }

        fetchDiscordData();
        setInterval(fetchDiscordData, 10000);
    </script>

    <!-- Script Xử Lý Phát Nhạc Nhẹ Nhàng & Không Bị Chặn -->
    <script>
        const audio = document.getElementById("bgMusic");
        const audioBtn = document.getElementById("audioBtn");
        const audioIcon = document.getElementById("audioIcon");

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    audioIcon.className = "fa-solid fa-volume-high";
                }).catch(err => console.log("Cần tương tác để phát nhạc:", err));
            } else {
                audio.pause();
                audioIcon.className = "fa-solid fa-volume-xmark";
            }
        }

        audioBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            togglePlay();
        });

        // Bấm bất kỳ đâu trên màn hình lần đầu tiên cũng sẽ tự bật nhạc
        document.body.addEventListener("click", function startOnFirstClick() {
            if (audio.paused) {
                togglePlay();
            }
            document.body.removeEventListener("click", startOnFirstClick);
        });
    </script>
</body>
</html>
