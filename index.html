    <!-- SCRIPT CHẠY HIỆU ỨNG TIÊU ĐỀ TAB -->
    <script>
        const titleText = "khanhdang. | bio";
        let titleIdx = 0;
        let isTitleDeleting = false;

        function animateTitle() {
            if (!isTitleDeleting) {
                document.title = titleText.substring(0, titleIdx + 1);
                titleIdx++;
                if (titleIdx === titleText.length) {
                    isTitleDeleting = true;
                    setTimeout(animateTitle, 2000);
                    return;
                }
            } else {
                document.title = titleText.substring(0, titleIdx - 1);
                titleIdx--;
                if (titleIdx === 0) {
                    isTitleDeleting = false;
                }
            }
            setTimeout(animateTitle, isTitleDeleting ? 120 : 220);
        }

        animateTitle();
    </script>

    <!-- SCRIPT CHẠY GÕ CHỮ CHO TÊN CHÍNH -->
    <script>
        let rawName = "khanhdang.";
        let nameIdx = 0;
        let isNameDeleting = false;

        function animateDisplayName() {
            const nameElem = document.getElementById('displayName');
            if (!nameElem) return;

            if (!isNameDeleting) {
                nameElem.innerText = rawName.substring(0, nameIdx + 1);
                nameIdx++;
                if (nameIdx === rawName.length) {
                    isNameDeleting = true;
                    setTimeout(animateDisplayName, 2500);
                    return;
                }
            } else {
                nameElem.innerText = rawName.substring(0, nameIdx - 1);
                nameIdx--;
                if (nameIdx === 0) {
                    isNameDeleting = false;
                }
            }
            setTimeout(animateDisplayName, isNameDeleting ? 100 : 180);
        }

        animateDisplayName();
    </script>

    <!-- Script kết nối API Discord (Lanyard) -->
    <script>
        const DISCORD_ID = "1514256094090760322";

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const res = await response.json();

                if (res.success && res.data) {
                    const data = res.data;
                    const user = data.discord_user;

                    if (user.global_name || user.username) {
                        rawName = user.global_name || user.username;
                    }
                    document.getElementById('statusUsername').innerText = user.global_name || user.username;

                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`;
                        document.getElementById('userAvatar').src = avatarUrl;
                        document.getElementById('smallAvatar').src = avatarUrl;
                        document.getElementById('discImg').src = avatarUrl;
                    }

                    if (user.avatar_decoration_data) {
                        const frameAsset = user.avatar_decoration_data.asset;
                        const frameUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${frameAsset}.png`;
                        const frameElem = document.getElementById('userFrame');
                        frameElem.src = frameUrl;
                        frameElem.style.display = 'block';
                    }

                    const dot = document.getElementById('statusDot');
                    const statusColors = {
                        online: '#23a55a',
                        idle: '#f0b232',
                        dnd: '#f23f43',
                        offline: '#747f8d'
                    };
                    dot.style.background = statusColors[data.discord_status] || '#747f8d';

                    const activityElem = document.getElementById('discordActivity');
                    if (data.activities && data.activities.length > 0) {
                        const customStatus = data.activities.find(a => a.type === 4);
                        if (customStatus && customStatus.state) {
                            activityElem.innerText = customStatus.state;
                        } else if (data.activities[0].name) {
                            activityElem.innerText = `Playing ${data.activities[0].name}`;
                        }
                    } else {
                        activityElem.innerText = "Chan Bố M đi";
                    }
                }
            } catch (err) {
                console.log("Lỗi tải dữ liệu Discord:", err);
            }
        }

        fetchDiscordData();
        setInterval(fetchDiscordData, 10000);
    </script>

            { time: 168, text: "Đôi chân anh rụng rơi như lá, mai này đây nhìn em lộng lẫy áo thêu hoa" },
            { time: 175, text: "Một nụ cười cứ thế chia xa, xin đừng yêu, đừng thương xót anh mà, baby..." },
            { time: 182, text: "Tôi nhất định đại cơ sương hạ thu đông..." },
            { time: 188, text: "Thả cô đừng quên tôi nha..." },
            { time: 194, text: "Đôi chân cuộc đời như lá, mai này nhìn em lộng lẫy áo thêu hoa..." },
            { time: 200, text: "Dù lần này có thắng hay thua... thì anh cũng đành thôi." }
        ];

        const audioBtn = document.getElementById("audioBtn");
        const audioIcon = document.getElementById("audioIcon");
        const discImg = document.getElementById("discImg");
        const discWrapper = document.getElementById("discWrapper");
        const lyricsText = document.getElementById("lyricsText");
        const progressBar = document.getElementById("progressBar");
        const timeDisplay = document.getElementById("timeDisplay");
        const heartBtn = document.getElementById("heartBtn");

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'boKJ5XDs_mY',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'boKJ5XDs_mY'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();

            const autoPlayHandler = () => {
                if (ytPlayer && typeof ytPlayer.playVideo === 'function' && !isMusicPlaying) {
                    ytPlayer.playVideo();
                }
                document.removeEventListener('click', autoPlayHandler);
                document.removeEventListener('touchstart', autoPlayHandler);
            };

            document.addEventListener('click', autoPlayHandler);
            document.addEventListener('touchstart', autoPlayHandler);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isMusicPlaying = true;
                audioIcon.className = "fa-solid fa-volume-high";
                discImg.classList.add("playing");
                startMusicTimer();
            } else {
                isMusicPlaying = false;
                audioIcon.className = "fa-solid fa-volume-xmark";
                discImg.classList.remove("playing");
                stopMusicTimer();
            }
        }

        function startMusicTimer() {
            stopMusicTimer();
            timerInterval = setInterval(() => {
                if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;

                const currentTime = ytPlayer.getCurrentTime();
                const duration = ytPlayer.getDuration() || 1;

                // Định dạng thời gian 00:00:00
                const hours = Math.floor(currentTime / 3600);
                const minutes = Math.floor((currentTime % 3600) / 60);
                const seconds = Math.floor(currentTime % 60);

                timeDisplay.innerText = 
                    String(hours).padStart(2, '0') + ':' +
                    String(minutes).padStart(2, '0') + ':' +
                    String(seconds).padStart(2, '0');

                // Thanh tiến trình
                const percent = (currentTime / duration) * 100;
                progressBar.style.width = percent + '%';

                // Lấy câu hát tương ứng
                let currentLine = lyricsData[0].text;
                for (let i = 0; i < lyricsData.length; i++) {
                    if (currentTime >= lyricsData[i].time) {
                        currentLine = lyricsData[i].text;
                    } else {
                        break;
                    }
                }

                if (lyricsText.innerText !== currentLine) {
                    lyricsText.innerText = currentLine;
                }
            }, 100);
        }

        function stopMusicTimer() {
            clearInterval(timerInterval);
        }

        function togglePlay() {
            if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
            if (isMusicPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        audioBtn.addEventListener("click", togglePlay);
        discWrapper.addEventListener("click", togglePlay);

        heartBtn.addEventListener("click", () => {
            const icon = heartBtn.querySelector("i");
            if (icon.classList.contains("fa-regular")) {
                icon.className = "fa-solid fa-heart";
                icon.style.color = "#ef4444";
            } else {
                icon.className = "fa-regular fa-heart";
                icon.style.color = "#ffffff";
            }
        });

        document.getElementById("progressContainer").addEventListener("click", (e) => {
            if (!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const duration = ytPlayer.getDuration();
            ytPlayer.seekTo((clickX / width) * duration, true);
        });
    </script>
</body>
</html>
