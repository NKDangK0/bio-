<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Khánh Đăng</title>
    <!-- Thư viện FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a url('https://i.pinimg.com/originals/f9/57/6f/f9576fca9fc8ef79976a1d6327bbe9ae.gif') no-repeat center center/cover;
            color: #fff;
            padding: 20px;
        }

        /* KHUNG CHÍNH (CARD) */
        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(15, 20, 35, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* BANNER VIDEO/GIF PHÍA TRÊN */
        .banner-box {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .banner-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .banner-sub {
            font-size: 12px;
            color: #cbd5e1;
        }

        /* PROFILE HEADER */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            object-fit: cover;
        }

        .avatar-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            pointer-events: none;
            display: none;
        }

        .user-info {
            text-align: left;
        }

        .name-link {
            text-decoration: none;
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            transition: 0.3s;
        }

        .name-link:hover .name {
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 1);
        }

        .location {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* TRẠNG THÁI DISCORD */
        .status-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #747f8d;
            border-radius: 50%;
        }

        .status-text {
            font-size: 12px;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* SOCIAL ICONS */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .social-icons a {
            color: #fff;
            font-size: 18px;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-icons a:hover {
            transform: translateY(-3px);
            background: #5865F2;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
        }

        /* TRÌNH PHÁT NHẠC */
        .music-player-box {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .music-cover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .music-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .music-title {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-text {
            font-size: 10px;
            color: #94a3b8;
            font-family: monospace;
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #00d2ff;
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .control-btn:hover {
            color: #00d2ff;
        }

        .play-btn {
            width: 38px;
            height: 38px;
            background: #00d2ff;
            color: #0f172a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: #ffffff;
            color: #00d2ff;
            box-shadow: 0 0 18px rgba(0, 210, 255, 0.8);
        }

        /* ẨN KHUNG YOUTUBE NỀN */
        .yt-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            top: -9999px;
            left: -9999px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- BANNER ANIME ĐỘNG -->
        <div class="banner-box">
            <img class="banner-img" src="https://i.pinimg.com/originals/f9/57/6f/f9576fca9fc8ef79976a1d6327bbe9ae.gif" alt="Anime Banner">
            <div class="banner-overlay">
                <span class="banner-title">My Discord Server</span>
                <span class="banner-sub">discord.gg/tg7BTRZht</span>
            </div>
        </div>

        <!-- PROFILE HEADER -->
        <div class="profile-header">
            <div class="avatar-container">
                <img class="avatar-img" id="userAvatar" src="./images.ico" alt="Avatar">
                <img class="avatar-frame" id="userFrame" src="" alt="Decoration">
            </div>
            <div class="user-info">
                <a href="https://discord.com/users/1514256094090760322" target="_blank" class="name-link">
                    <h2 class="name" id="displayName">khanhdang.</h2>
                </a>
                <p class="location"><i class="fa-solid fa-location-dot"></i> Đồng Nai, Việt Nam</p>
            </div>
        </div>

        <!-- STATUS BOX DISCORD -->
        <div class="status-box">
            <div class="online-dot" id="statusDot"></div>
            <span class="status-text" id="discordActivity">currently doing nothing</span>
        </div>

        <!-- SOCIAL ICONS -->
        <div class="social-icons">
            <a href="https://facebook.com" target="_blank" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://discord.gg/tg7BTRZht" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="https://www.tiktok.com/@_k...dang_" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" target="_blank" title="Website"><i class="fa-solid fa-globe"></i></a>
        </div>

        <!-- TRÌNH PHÁT NHẠC -->
        <div class="music-player-box">
            <img class="music-cover" src="./images.ico" alt="Mèo Nakroth">
            
            <div class="music-details">
                <div class="music-title" title="Như Một Người Dưng Lofi">Như Một Người Dưng Lofi...</div>
                
                <div class="progress-container">
                    <span class="time-text" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time-text" id="durationTime">1:03:15</span>
                </div>
            </div>

            <div class="music-controls">
                <button class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-btn" id="playBtn">
                    <i id="playIcon" class="fa-solid fa-play"></i>
                </button>
                <button class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>
    </div>

    <!-- Khung YouTube Ẩn -->
    <div class="yt-hidden">
        <div id="player"></div>
    </div>

    <!-- Script kết nối API Discord (Lanyard) -->
    <script>
        const DISCORD_ID = "1514256094090760322";

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const res = await response.json();

                if (res.success && res.data) {
                    const data = res.data;
                    const user = data.discord_user;

                    const nameElem = document.getElementById('displayName');
                    if (user.global_name) {
                        nameElem.innerText = user.global_name;
                    } else if (user.username) {
                        nameElem.innerText = user.username;
                    }

                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`;
                        document.getElementById('userAvatar').src = avatarUrl;
                    }

                    if (user.avatar_decoration_data) {
                        const frameAsset = user.avatar_decoration_data.asset;
                        const frameUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${frameAsset}.png`;
                        const frameElem = document.getElementById('userFrame');
                        frameElem.src = frameUrl;
                        frameElem.style.display = 'block';
                    }

                    const dot = document.getElementById('statusDot');
                    const statusColors = {
                        online: '#23a55a',
                        idle: '#f0b232',
                        dnd: '#f23f43',
                        offline: '#747f8d'
                    };
                    dot.style.background = statusColors[data.discord_status] || '#747f8d';

                    const activityElem = document.getElementById('discordActivity');
                    if (data.activities && data.activities.length > 0) {
                        const customStatus = data.activities.find(a => a.type === 4);
                        if (customStatus && customStatus.state) {
                            activityElem.innerText = customStatus.state;
                        } else if (data.activities[0].name) {
                            activityElem.innerText = `Playing ${data.activities[0].name}`;
                        }
                    }
                }
            } catch (err) {
                console.log("Lỗi tải dữ liệu Discord:", err);
            }
        }

        fetchDiscordData();
        setInterval(fetchDiscordData, 10000);
    </script>

    <!-- YouTube API Script Phát Từ Đầu (0s) -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let ytPlayer;
        let isPlaying = false;
        let timerInterval;

        const playBtn = document.getElementById("playBtn");
        const playIcon = document.getElementById("playIcon");
        const currentTimeElem = document.getElementById("currentTime");
        const durationTimeElem = document.getElementById("durationTime");
        const progressFill = document.getElementById("progressFill");
        const progressBar = document.getElementById("progressBar");

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '200',
                width: '200',
                videoId: 'bRjbXX7azr8',
                playerVars: {
                    'start': 0,
                    'autoplay': 0,
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            ytPlayer.unMute();
            ytPlayer.setVolume(100);
            ytPlayer.seekTo(0, true);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgress() {
            if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                const current = ytPlayer.getCurrentTime();
                const total = ytPlayer.getDuration() || 3795;
                currentTimeElem.innerText = formatTime(current);
                durationTimeElem.innerText = formatTime(total);

                const percent = (current / total) * 100;
                progressFill.style.width = `${percent}%`;
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                timerInterval = setInterval(updateProgress, 1000);
            } else {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                clearInterval(timerInterval);
            }
        }

        playBtn.addEventListener("click", function() {
            if (!ytPlayer) return;
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        });

        progressBar.addEventListener("click", function(e) {
            if (!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const total = ytPlayer.getDuration();
            const seekTime = (clickX / width) * total;
            ytPlayer.seekTo(seekTime, true);
        });
    </script>
</body>
</html>
