        body {
            font-family: 'Poppins', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* ---------------- MÀN HÌNH CLICK TO ENTER ---------------- */
        #enterOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            user-select: none;
        }

        #enterOverlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-text {
            font-family: 'UnifrakturMaguntia', 'Cinzel', serif;
            font-size: 32px;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            animation: textBreathe 2s ease-in-out infinite;
        }

        @keyframes textBreathe {
            0%, 100% {
                opacity: 0.6;
                transform: scale(0.98);
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
                text-shadow: 0 0 25px rgba(255, 255, 255, 0.95);
            }
        }

        /* ---------------- WIDGET ĐỒNG HỒ PHONG CÁCH KÍNH MỜ ĐEN TRẮNG CỰC NÉT ---------------- */
        .clock-widget {
            position: fixed;
            top: 25px;
            right: 35px;
            text-align: right;
            z-index: 10;
            user-select: none;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 22px;
            padding: 12px 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
            transition: all 0.3s ease;
        }

        .clock-widget:hover {
            background: rgba(15, 23, 42, 0.65);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .clock-date {
            font-family: 'Fredoka', 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-bottom: 2px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .star-glow {
            color: #ffffff;
            display: inline-block;
            text-shadow: 0 0 8px #ffffff, 0 0 15px #ffffff;
            animation: starPulse 2.5s infinite ease-in-out;
            margin: 0 1px;
        }

        @keyframes starPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 2px #fff);
            }
            50% {
                transform: scale(1.25);
                filter: drop-shadow(0 0 10px #fff);
            }
        }

        .clock-time {
            font-family: 'Mochiy Pop One', 'Fredoka', sans-serif;
            font-size: 64px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .clock-seconds {
            font-size: 32px;
            margin-left: 5px;
            color: #94a3b8;
            text-shadow: none;
        }

        @media (max-width: 768px) {
            .clock-widget {
                top: 15px;
                right: 15px;
                padding: 8px 14px;
                transform: scale(0.7);
                transform-origin: top right;
            }
        }

        /* VIDEO NỀN ĐỘNG WANDERING SAMURAI */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -999;
            pointer-events: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.12);
            z-index: -998;
            pointer-events: none;
        }

        /* NÚT LOA TÔNG TRẮNG - XÁM BẠC */
        .audio-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 20px;
            transition: all 0.3s ease;
            z-index: 99999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);

    <script>
        function updateClock() {
            const now = new Date();
            
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
            const months = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
            
            let dayName = days[now.getDay()];
            let dayFormatted = dayName;
            if (dayName.includes('A')) {
                dayFormatted = dayName.replace('A', '<span class="star-glow">★</span>');
            }
            
            const monthName = months[now.getMonth()];
            const dateNum = now.getDate();
            
            const dateElem = document.getElementById("clockDate");
            if (dateElem) {
                dateElem.innerHTML = `${dayFormatted}, ${monthName} ${dateNum}`;
            }
            
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            const hoursElem = document.getElementById("clockHours");
            const minsElem = document.getElementById("clockMinutes");
            const secsElem = document.getElementById("clockSeconds");
            
            if (hoursElem) hoursElem.innerText = h;
            if (minsElem) minsElem.innerText = m;
            if (secsElem) secsElem.innerText = `:${s}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

    <!-- SCRIPT KẾT NỐI API DISCORD (LANYARD) -->
    <script>
        const DISCORD_ID = "1514256094090760322";

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const res = await response.json();

                if (res.success && res.data) {
                    const data = res.data;
                    const user = data.discord_user;

                    if (user.global_name || user.username) {
                        rawName = user.global_name || user.username;
                    }
                    document.getElementById('statusUsername').innerText = user.global_name || user.username;

                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`;
                        document.getElementById('userAvatar').src = avatarUrl;
                        document.getElementById('smallAvatar').src = avatarUrl;
                        document.getElementById('discImg').src = avatarUrl;
                    }

                    if (user.avatar_decoration_data) {
                        const frameAsset = user.avatar_decoration_data.asset;
                        const frameUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${frameAsset}.png`;
                        const frameElem = document.getElementById('userFrame');
                        frameElem.src = frameUrl;
                        frameElem.style.display = 'block';
                    }

                    const dot = document.getElementById('statusDot');
                    const statusColors = {
                        online: '#23a55a',
                        idle: '#f0b232',
                        dnd: '#f23f43',
                        offline: '#747f8d'
                    };
                    dot.style.background = statusColors[data.discord_status] || '#747f8d';

                    const activityElem = document.getElementById('discordActivity');
                    if (data.activities && data.activities.length > 0) {
                        const customStatus = data.activities.find(a => a.type === 4);
                        if (customStatus && customStatus.state) {
                            activityElem.innerText = customStatus.state;
                        } else if (data.activities[0].name) {
                            activityElem.innerText = `Playing ${data.activities[0].name}`;
                        }
                    } else {
                        activityElem.innerText = "Chan Bố M đi";
                    }
                }
            } catch (err) {
                console.log("Lỗi tải dữ liệu Discord:", err);
            }
        }

        fetchDiscordData();
        setInterval(fetchDiscordData, 10000);
    </script>

    <script>
        let ytPlayer;
        let isMusicPlaying = false;
        let timerInterval;
        let hasEntered = false;

        const audioBtn = document.getElementById("audioBtn");
        const audioIcon = document.getElementById("audioIcon");
        const discImg = document.getElementById("discImg");
        const discWrapper = document.getElementById("discWrapper");
        const progressBar = document.getElementById("progressBar");
        const timeDisplay = document.getElementById("timeDisplay");
        const heartBtn = document.getElementById("heartBtn");
        const enterOverlay = document.getElementById("enterOverlay");

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'iFWLSdqeHDE',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'iFWLSdqeHDE'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            if (hasEntered) {
                event.target.playVideo();
            }
        }

        function enterBio() {
            if (hasEntered) return;
            hasEntered = true;

            enterOverlay.classList.add("hide");
            setTimeout(() => {
                enterOverlay.style.display = "none";
            }, 800);

            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.playVideo();
            }
        }

        enterOverlay.addEventListener("click", enterBio);
        enterOverlay.addEventListener("touchstart", enterBio);

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isMusicPlaying = true;
                audioIcon.className = "fa-solid fa-volume-high";
                discImg.classList.add("playing");
                startMusicTimer();
            } else {
                isMusicPlaying = false;
                audioIcon.className = "fa-solid fa-volume-xmark";
                discImg.classList.remove("playing");
                stopMusicTimer();
            }
        }

        function startMusicTimer() {
            stopMusicTimer();
            timerInterval = setInterval(() => {
                if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;

                const currentTime = ytPlayer.getCurrentTime();
                const duration = ytPlayer.getDuration() || 1;

                const hours = Math.floor(currentTime / 3600);
                const minutes = Math.floor((currentTime % 3600) / 60);
                const seconds = Math.floor(currentTime % 60);

                timeDisplay.innerText = 
                    String(hours).padStart(2, '0') + ':' +
                    String(minutes).padStart(2, '0') + ':' +
                    String(seconds).padStart(2, '0');

                const percent = (currentTime / duration) * 100;
                progressBar.style.width = percent + '%';
            }, 100);
        }

        function stopMusicTimer() {
            clearInterval(timerInterval);
        }

        function togglePlay() {
            if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
            if (isMusicPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        audioBtn.addEventListener("click", togglePlay);
        discWrapper.addEventListener("click", togglePlay);

        heartBtn.addEventListener("click", () => {
            const icon = heartBtn.querySelector("i");
            if (icon.classList.contains("fa-regular")) {
                icon.className = "fa-solid fa-heart";
                icon.style.color = "#ef4444";
            } else {
                icon.className = "fa-regular fa-heart";
                icon.style.color = "#ffffff";
            }
        });

        document.getElementById("progressContainer").addEventListener("click", (e) => {
            if (!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const duration = ytPlayer.getDuration();
            ytPlayer.seekTo((clickX / width) * duration, true);
        });
    </script>
</body>
</html>
